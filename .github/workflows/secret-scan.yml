name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'codex/**'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run secret scan gate
        run: node scripts/ci/secret-scan.mjs
