name: Determinism Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'codex/**'

jobs:
  deterministic-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic replay gate
        run: npm run ci:determinism
